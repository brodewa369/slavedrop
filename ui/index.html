  <div id="app">
    <!-- SINGLE TOP ROW: 10 items, left to right -->
    <header class="top-bar">
      <div class="tb-left">
      <div class="brand">
        <div class="logo"><img src="../fonts/logo-light.png" alt=""></div>
        <div class="brand-text">
          <h1>SlaveDrop</h1>
          <p id="brand-sub">local farming log</p>
        </div>
      </div>

      <div class="top-bar-daily" id="header-daily"></div>
      </div><!-- /tb-left -->

      <div class="tb-right">
      <div class="top-bar-search">
        <i class="ph ph-magnifying-glass"></i>
        <input class="input" id="search" type="search" placeholder="" aria-label="Search" autocomplete="off">
      </div>

      <div class="filter-wrap">
        <button type="button" class="btn btn-ghost btn-icon" id="btn-filter" title="Filters" aria-haspopup="true" aria-expanded="false"><i class="ph ph-funnel"></i><span class="f-dot" hidden></span></button>
        <div class="filter-pop" id="filter-pop" hidden>
          <div class="dd-wrap">
            <button type="button" class="chip dd" id="dd-net-btn">All networks</button>
            <div class="dd-pop" id="dd-net-pop" hidden></div>
          </div>
          <div class="dd-wrap">
            <button type="button" class="chip dd" id="dd-rank-btn">All ranks</button>
            <div class="dd-pop" id="dd-rank-pop" hidden></div>
          </div>
          <div class="dd-wrap">
            <button type="button" class="chip dd" id="dd-cat-btn">All categories</button>
            <div class="dd-pop" id="dd-cat-pop" hidden></div>
          </div>
          <div class="f-row">
            <span class="f-label" id="filter-todo-label">Show pending only</span>
            <button type="button" class="switch" id="filter-todo" role="switch" aria-checked="false" title="Show pending only"></button>
          </div>
        </div>
      </div>
      <button class="btn btn-ghost btn-icon" id="filter-compact" title="Compact view"><i class="ph ph-squares-four"></i></button>

      <button class="btn btn-ghost btn-icon" id="btn-add" title="New project"><i class="ph ph-plus"></i></button>
      <div class="menu-wrap">
        <button class="btn btn-ghost btn-icon" id="btn-menu" title="Menu"><i class="ph ph-list"></i></button>
        <div class="menu-pop" id="menu-pop" hidden>
          <div class="menu-seg">
            <span class="menu-label">Language</span>
            <div class="seg-toggle" id="m-locale">
              <button type="button" class="seg" data-locale="en">EN</button>
              <button type="button" class="seg" data-locale="id">ID</button>
            </div>
          </div>
          <div class="menu-seg">
            <span class="menu-label">Mode</span>
            <button type="button" class="seg-toggle single" id="m-theme" title="Switch theme"></button>
          </div>
          <div class="menu-seg">
            <span class="menu-label">Theme</span>
            <div class="seg-toggle" id="m-skin" title="Interface theme">
              <button type="button" class="seg skin-btn" data-skin="base" title="Default"><i class="ph ph-list" data-icon="list"></i></button>
              <button type="button" class="seg skin-btn" data-skin="paper" title="Paper Ledger"><i class="ph ph-notebook" data-icon="journal"></i></button>
              <button type="button" class="seg skin-btn" data-skin="aurora" title="Liquid Aurora"><i class="ph ph-mountains" data-icon="mountain-snow"></i></button>
              <button type="button" class="seg skin-btn" data-skin="crt" title="Terminal CRT"><i class="ph ph-terminal" data-icon="terminal-simple"></i></button>
            </div>
          </div>
          <div class="menu-seg bg-row" id="m-bg-row"></div>
          <div class="menu-div"></div>
          <button type="button" class="menu-item" id="m-backup"></button>
          <button type="button" class="menu-item" id="m-restore"></button>
        </div>
      </div><!-- /menu-wrap -->
      </div><!-- /tb-right -->
    </header>

    <!-- CALENDAR: full width -->
    <div class="dashboard">
      <div class="cal-strip" id="cal-strip">
        <div class="cal-main">
          <div class="cal-head">
          <button class="btn btn-ghost btn-icon" id="cal-prev"><i class="ph ph-caret-left"></i></button>
          <span class="cal-title" id="cal-title"></span>
          <button class="btn btn-ghost btn-icon" id="cal-next"><i class="ph ph-caret-right"></i></button>
          <span class="hd-right"><button class="btn btn-sm" id="cal-today">Today</button><span class="cal-clock" id="dl-clock"></span></span>
        </div>
        <div class="cal-grid-wrap" id="cal-grid-wrap">
          <div class="cal" id="cal"></div>
        </div>
        <div class="cal-dl-detail" id="cal-dl-detail" hidden></div>
        </div><!-- /.cal-main (left column) -->
        <div class="cal-dl-summary" id="cal-dl-summary">
          <div class="wk-head">
            <h4 id="wk-title">Deadlines This Week</h4>
            <button class="btn btn-ghost btn-icon" id="cal-toggle" title="Collapse calendar"></button>
          </div>
          <div class="wk-list" id="wk-list"></div>
        </div>
      </div>
    </div>

    <!-- 3. PROJECT CARDS (grid; compact mode = single-line rows) -->
    <div class="view" id="view">
      <div id="grid" class="grid"></div>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="card-menu-pop" id="card-menu" hidden>
    <button class="menu-item" data-mact="edit"><i class="ph ph-pencil-simple"></i> Edit project</button>
    <button class="menu-item danger" data-mact="del"><i class="ph ph-trash"></i> Delete project</button>
  </div>
  <aside class="detail" id="detail" aria-hidden="true"></aside>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>

  <div class="toasts" id="toasts"></div>

  <script src="tauri-bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
