<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>G1 · Liquid Glass Aurora</title>
<style>
  /* MATERIAL: true refraction — feTurbulence lens + chromatic dispersion + specular edge
     FONT: Geist Sans + Geist Mono (via local Vercel CDN fallback system-ui) */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root {
    --accent:#7dd3fc; --ease:cubic-bezier(.16,1,.3,1);
  }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',-apple-system,system-ui,sans-serif; color:#eef4ff;
    min-height:100vh; padding:30px 40px 56px; overflow-x:hidden; position:relative;
    background:#04060f; }
  /* aurora blobs — ini yang akan dibiaskan oleh glass */
  .blob { position:fixed; border-radius:50%; filter:blur(0px); pointer-events:none; z-index:0; }
  .b1 { width:55vw; height:45vw; left:-12vw; top:-14vw; background:radial-gradient(circle,#0e7490,transparent 65%); }
  .b2 { width:50vw; height:42vw; right:-10vw; top:-8vw; background:radial-gradient(circle,#4338ca,transparent 65%); }
  .b3 { width:60vw; height:50vw; left:24vw; bottom:-22vw; background:radial-gradient(circle,#831843,transparent 65%); }
  .b4 { width:34vw; height:34vw; right:6vw; bottom:-10vw; background:radial-gradient(circle,#155e75,transparent 65%); }
  .wrap { position:relative; z-index:1; }
  .ic { width:16px; height:16px; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .head { display:flex; align-items:center; gap:15px; margin-bottom:24px; }
  .head h1 { font-size:20px; font-weight:650; letter-spacing:-.025em; }
  .head .sub { font-family:'JetBrains Mono',monospace; font-size:10.5px; color:#8ea3c4; letter-spacing:.05em; }
  .head .sp { flex:1; }
  .btn { display:flex; align-items:center; gap:7px; font-size:12px; font-weight:550; color:#c8d6ec;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16); border-radius:999px;
    padding:8px 14px; cursor:pointer; transition:.2s var(--ease);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22); }
  .btn:hover { background:rgba(255,255,255,.12); transform:translateY(-1px); }
  .btn.primary { color:#03121f; background:rgba(125,211,252,.9); border-color:rgba(255,255,255,.4); }
  .btn.primary:hover { background:rgba(160,226,255,.95); }
  .stat-strip { display:flex; gap:12px; margin-bottom:22px; }
  .stat { flex:1; padding:14px 16px; border-radius:16px; }
  .stat .k { font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:#93a7c9; margin-bottom:6px; }
  .stat .v { font-size:24px; font-weight:700; letter-spacing:-.03em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px; }
  .card { position:relative; border-radius:22px; padding:18px; cursor:pointer; transition:transform .25s var(--ease); }
  .card:hover { transform:translateY(-4px) scale(1.012); }
  .glass { position:relative; isolation:isolate;
    background:rgba(255,255,255,.075);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:
      inset 0 1.5px 0.5px rgba(255,255,255,.5),   /* specular top edge */
      inset 0 -1px 0.5px rgba(255,255,255,.12),   /* faint bounce */
      inset 0 0 22px rgba(255,255,255,.03),
      0 26px 60px -22px rgba(0,0,0,.9);
  }
  @supports ((backdrop-filter:url(#refract)) or (-webkit-backdrop-filter:url(#refract))) {
    .glass { -webkit-backdrop-filter:url(#refract) blur(3px) saturate(160%);
             backdrop-filter:url(#refract) blur(3px) saturate(160%); }
  }
  @supports not (backdrop-filter:url(#refract)) {
    .glass { -webkit-backdrop-filter:blur(20px) saturate(170%);
             backdrop-filter:blur(20px) saturate(170%); }
  }
  .row { display:flex; align-items:center; gap:11px; margin-bottom:13px; }
  .box { width:20px; height:20px; border-radius:7px; border:1.5px solid rgba(255,255,255,.35); display:grid; place-items:center;
    flex:none; cursor:pointer; transition:.18s var(--ease); background:rgba(255,255,255,.05); }
  .box:hover { border-color:rgba(255,255,255,.7); }
  .box.on { background:var(--accent); border-color:rgba(255,255,255,.6); }
  .box svg { width:12px; height:12px; stroke:#03121f; stroke-width:3.2; fill:none; opacity:0; }
  .box.on svg { opacity:1; }
  h2 { font-size:16px; font-weight:600; letter-spacing:-.015em; }
  .sp { flex:1; }
  .rank { font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:600; letter-spacing:.09em;
    color:#c9d8f5; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); padding:3px 8px; border-radius:6px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .tag { font-size:10px; font-weight:500; letter-spacing:.03em; color:#b9c8e4;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); border-radius:999px; padding:3px 9px; }
  .bar { height:6px; background:rgba(255,255,255,.1); border-radius:999px; overflow:hidden; margin-bottom:12px;
    box-shadow:inset 0 1px 1px rgba(0,0,0,.35); }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#38bdf8,#a78bfa); border-radius:999px;
    box-shadow:0 0 10px rgba(125,211,252,.6); transition:width .5s var(--ease); }
  .foot { display:flex; align-items:center; gap:9px; }
  .num { font-family:'JetBrains Mono',monospace; font-size:10.5px; color:#a8b9d6; }
  .menu { position:absolute; top:14px; right:14px; width:28px; height:28px; border-radius:9px; display:grid; place-items:center;
    color:#aebdd8; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); cursor:pointer;
    opacity:0; transition:.18s var(--ease); }
  .card:hover .menu { opacity:1; }
  .menu:hover { color:#fff; background:rgba(255,255,255,.14); }
  @media (prefers-reduced-transparency: reduce) {
    .glass, .stat { background:#111827; backdrop-filter:none; -webkit-backdrop-filter:none; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  }
</style>
</head>
<body>
<!-- SVG refraction shader: turbulence → blur → displacement + chromatic split -->
<svg width="0" height="0" aria-hidden="true" style="position:fixed">
  <filter id="refract" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="1.4" result="smooth"/>
    <feDisplacementMap in="SourceGraphic" in2="smooth" scale="44" xChannelSelector="R" yChannelSelector="G" result="bent"/>
    <feGaussianBlur in="bent" stdDeviation="0.6" result="soft"/>
    <feComponentTransfer in="smooth" result="ring">
      <feFuncA type="table" tableValues="0 0 0.35 1"/>
    </feComponentTransfer>
    <feComposite in="soft" in2="ring" operator="in" result="glassOut"/>
  </filter>
</svg>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>

<div class="wrap">
  <div class="head">
    <h1>Portfolio</h1><span class="sub">12 projects · 5 done</span><span class="sp"></span>
    <button class="btn">All</button><button class="btn">Pending</button>
    <button class="btn primary"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New project</button>
  </div>
  <div class="stat-strip">
    <div class="stat glass"><div class="k">Active</div><div class="v">7</div></div>
    <div class="stat glass"><div class="k">Completed</div><div class="v">5</div></div>
    <div class="stat glass"><div class="k">Value</div><div class="v">$4.2k</div></div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
const ICONS = {
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l5 5L19 7"/></svg>',
  more:'<svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="18.5" r="1.5" fill="currentColor" stroke="none"/></svg>',
};
const DATA = [
  ['Hyperliquid','S',72,8,11,['Solana','Testnet','X'],'on'],
  ['LayerZero V2','A',40,4,10,['Ethereum','Mainnet'],''],
  ['Eigenlayer','S',100,9,9,['Ethereum','Restaking','App'],'on'],
  ['Berachain','B',15,1,7,['Berachain','Testnet'],''],
  ['Monad','A',58,5,9,['Monad','Desktop'],'on'],
  ['Celestia','C',0,0,6,['Celestia','Light node'],''],
];
document.getElementById('grid').innerHTML = DATA.map(([n,r,p,d,t,tags,on]) => `
  <div class="card glass">
    <button class="menu" data-act="menu">${ICONS.more}</button>
    <div class="row">
      <span class="box ${on}" data-act="toggle">${ICONS.check}</span>
      <h2>${n}</h2><span class="sp"></span><span class="rank">${r}</span>
    </div>
    <div class="tags">${tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    <div class="bar"><i style="width:${p}%"></i></div>
    <div class="foot"><span class="num">${d}/${t} tasks</span><span class="sp"></span><span class="num">${p}%</span></div>
  </div>`).join('');
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act="toggle"]'); if (b) b.classList.toggle('on');
});
</script>
</body>
</html>
